# Publishes the image the README runs, for both kinds of machine, whenever a
# version is tagged.
name: Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # So an image for Apple and other arm64 machines can be built here.
      - name: Set up building for both
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use

      - name: Build and publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$image:${GITHUB_REF_NAME}" --tag "$image:latest" --push .
